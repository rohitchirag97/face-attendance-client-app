server {
  listen 80;
  root /usr/share/nginx/html;

  # Redirects keep the host and port the browser used (e.g. :8080), not the container's port 80.
  absolute_redirect off;

  # Hashed build files never change, so browsers may keep them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes (e.g. /attendance) all load the app shell; it must never be cached stale.
  # No $uri/ here: the app's /assets page must not resolve to the build's assets folder.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
