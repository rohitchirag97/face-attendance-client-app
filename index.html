<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Vetanly</title>
    <meta name="description" content="Sign in to Vetanly: face-recognition attendance, HR and payroll." />
    <!-- The dashboard is private; search engines should list the marketing site instead. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#5938E8" />
    <script>
      // Applies the saved theme before the first paint, so dark mode never flashes white.
      // Keep in step with src/lib/theme.ts.
      (function () {
        var theme = "system";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
